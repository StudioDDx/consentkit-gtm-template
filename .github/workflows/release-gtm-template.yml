name: release-gtm-template
on:
  push:
    branches: [ops/gtm-release-20261113]
    paths: ['ops/RELEASE']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/gtm-candidate-2-20261113
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to rebuild if the patch is already applied
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/release.patch
          if git apply --unidiff-zero --check --reverse /tmp/release.patch 2>/dev/null; then
            echo "release patch is already applied at HEAD; refusing to rebuild"
            exit 1
          fi
          git apply --unidiff-zero --check /tmp/release.patch
      - name: Apply release patch and pin metadata
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/release.patch
          git apply --unidiff-zero /tmp/release.patch
          test "$(sha256sum template.tpl | cut -d" " -f1)" = "e78607e8c08bd55e61f1b1b4b419486c19f6412bb0dddcaeed3a70d2734f5a61"
          test "$(sha256sum README.md | cut -d" " -f1)" = "8f6038e9abcfa22c66dcacdb445b7836d8e18267e087ae321fc81bc68a2be765"
          git config user.name "StudioDDx Release Bot"
          git config user.email "release-bot@studioddx.com"
          git add template.tpl README.md
          git commit -m "Release ConsentKit CMP template 2: defer saved consent to widget consent_update"
          SHA=$(git rev-parse HEAD)
          {
            echo '# Community Template Gallery version manifest.'
            echo '# https://developers.google.com/tag-platform/tag-manager/templates/gallery'
            echo 'homepage: "https://consentkit.us"'
            echo 'documentation: "https://github.com/StudioDDx/consentkit-gtm-template/blob/main/template.tpl"'
            echo 'versions:'
            echo "  - sha: $SHA"
            echo '    changeNotes: "ConsentKit CMP 1.1.0 - deferred saved consent applied from widget consent_update after jurisdiction/GPC resolution; widget loader via widget.consentkit.us."'
          } > metadata.yaml
          git add metadata.yaml
          git commit -m "Pin gallery metadata to $SHA"
          git push origin HEAD:release/gtm-candidate-2-20261113
      - name: Report artifact identity
        run: |
          set -euo pipefail
          echo "template bytes: $(wc -c < template.tpl)"
          sha256sum template.tpl
          grep -n '"id": "' template.tpl
          echo "pinned template commit: $(sed -n 's/^  - sha: //p' metadata.yaml)"
