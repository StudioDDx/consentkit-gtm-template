name: probe
on:
  push:
    branches: [ops/gtm-release-20261113]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "probe $(date -u +%s)" > probe.txt
          git config user.name "StudioDDx Release Bot"
          git config user.email "release-bot@studioddx.com"
          git add probe.txt
          git commit -m "probe"
          git push
